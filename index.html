:root{

  --accent:#c9a04a; --accent2:#7a5cc6; --danger:#c33a4e; --ok:#4bb87a;
  --hp:#d04050; --sta:#4a90d0; --xp:#c9a04a;
  --nav-h:64px; --head-h:52px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px;line-height:1.4;overscroll-behavior:none;user-select:none}
body{min-height:100dvh;background:

  radial-gradient(ellipse at bottom,#0d0820 0%,transparent 70%),var(--bg)}
#app{display:flex;flex-direction:column;min-height:100dvh;padding-bottom:env(safe-area-inset-bottom)}
#header{display:flex;align-items:center;gap:8px;height:var(--head-h);
  padding:0 10px;padding-top:env(safe-area-inset-top);
  background:rgba(14,10,28,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.h-title{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.1}
#header-loc{font-size:13px;color:var(--accent);font-weight:600;letter-spacing:.5px}
#header-night{font-size:10px;color:var(--muted);letter-spacing:1px}
.icon-btn{background:transparent;border:1px solid var(--line);color:var(--text);
  width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer}
.icon-btn:active{background:var(--panel2)}
#screen{flex:1;padding:14px 14px calc(var(--nav-h) + 24px);overflow-y:auto;
  -webkit-overflow-scrolling:touch}
h1,h2,h3{margin:0 0 8px}
h1{font-size:22px;color:var(--accent);letter-spacing:1px}
h2{font-size:17px;color:var(--accent)}
h3{font-size:15px;color:var(--text)}
p{margin:6px 0;color:var(--text)}
.muted{color:var(--muted);font-size:13px}
.center{text-align:center}
.panel{background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel.tight{padding:10px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.grow{flex:1}
.gap{margin-top:8px}
.btn{display:block;width:100%;padding:13px 14px;margin:6px 0;border-radius:12px;
  background:linear-gradient(180deg,var(--panel2),#120b24);
  border:1px solid var(--line);color:var(--text);font-size:15px;font-weight:500;
  cursor:pointer;text-align:left;transition:.12s}
.btn:active{transform:scale(.985);background:var(--panel)}
.btn.primary{background:linear-gradient(180deg,#3a2a6a,#241a44);
  border-color:var(--accent2);color:#fff}
.btn.gold{border-color:var(--accent);color:var(--accent)}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:9px 12px;font-size:13px;width:auto;display:inline-block;margin:3px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:0;text-align:center}
.bar{height:10px;border-radius:6px;background:#0a0616;overflow:hidden;
  border:1px solid var(--line);margin:3px 0}
.bar > div{height:100%;transition:width .25s}
.bar.hp > div{background:linear-gradient(90deg,#7c2534,#e05568)}
.bar.sta > div{background:linear-gradient(90deg,#25416b,#5ba3e8)}
.bar.xp > div{background:linear-gradient(90deg,#7c5c1e,#e0b658)}
.bar.enemy > div{background:linear-gradient(90deg,#5c1e3d,#b0557c)}
.stat-row{display:flex;gap:10px;font-size:12px;color:var(--muted);margin:3px 0}
.stat-row b{color:var(--text);font-weight:600}
.stat-chip{background:#0f0a20;border:1px solid var(--line);border-radius:8px;
  padding:4px 8px;font-size:11px;color:var(--muted);display:inline-block;margin:2px}
.stat-chip b{color:var(--accent)}
#bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(10,6,20,.96);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);z-index:30}
#bottom-nav button{background:transparent;border:0;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;font-size:9px;letter-spacing:.5px;cursor:pointer;padding:4px}
#bottom-nav button i{font-style:normal;font-size:18px;line-height:1}
#bottom-nav button.active{color:var(--accent)}
#modal-root{position:fixed;inset:0;z-index:50;display:none;
  align-items:flex-end;justify-content:center}
#modal-root.show{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(3px)}
.modal{position:relative;width:100%;max-width:520px;max-height:88dvh;
  background:linear-gradient(180deg,var(--panel),#0d0820);
  border:1px solid var(--line);border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));
  overflow-y:auto;animation:slideUp .22s ease-out}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-title{font-size:17px;color:var(--accent);margin-bottom:10px;font-weight:600}
#toast-root{position:fixed;top:calc(var(--head-h) + 8px);left:0;right:0;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  pointer-events:none;z-index:60}
.toast{background:#1d1533;border:1px solid var(--accent2);color:var(--text);
  padding:9px 14px;border-radius:10px;font-size:13px;max-width:90%;
  box-shadow:0 6px 24px rgba(0,0,0,.5);animation:fadeIn .18s}
.toast.err{border-color:var(--danger)}
.toast.ok{border-color:var(--ok)}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.enemy-card{text-align:center;padding:14px;background:
  radial-gradient(ellipse at center,#1e1440 0%,transparent 70%);
  border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.enemy-name{font-size:18px;color:var(--accent);font-weight:600}
.enemy-tag{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.combat-log{background:#0a0616;border:1px solid var(--line);border-radius:10px;
  padding:10px;height:120px;overflow-y:auto;font-size:12px;line-height:1.5;color:var(--muted)}
.combat-log div{margin:2px 0}
.combat-log .me{color:#8fc4f0}
.combat-log .foe{color:#e08a9a}
.combat-log .sp{color:#c9a04a}
.combat-log .sys{color:#9b92b8;font-style:italic}
.item-row{display:flex;align-items:center;gap:10px;padding:10px;
  border:1px solid var(--line);border-radius:10px;margin-bottom:6px;
  background:#120c22;cursor:pointer}
.item-row:active{background:var(--panel2)}

  display:flex;align-items:center;justify-content:center;font-size:18px;
  border:1px solid var(--line);flex-shrink:0}
.item-body{flex:1;min-width:0}
.item-name{font-size:14px;color:var(--text);font-weight:500;

.item-sub{font-size:11px;color:var(--muted)}
.rarity-common{color:#a0a0b0}
.rarity-uncommon{color:#4bb87a}
.rarity-rare{color:#4a90d0}
.rarity-epic{color:#a06ce0}
.rarity-legendary{color:#e0a84a}
.rarity-mythic{color:#e055a0}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:13px}
input,textarea{width:100%;padding:12px;border-radius:10px;background:#0a0616;
  color:var(--text);border:1px solid var(--line);font-size:15px;font-family:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--accent2)}
label.muted{display:block;margin-top:10px;margin-bottom:4px}
</style>
</head>

/* ---------- TELEGRAM ---------- */
const TG = (function(){
  let tg=null, ready=false;
  function init(){
    try{
      if(window.Telegram && window.Telegram.WebApp){
        tg=window.Telegram.WebApp;
        if(tg.ready) tg.ready();
        if(tg.expand) tg.expand();
        if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        ready=true;
        try{tg.setHeaderColor&&tg.setHeaderColor('#0e0a1c');}catch(e){}
        try{tg.setBackgroundColor&&tg.setBackgroundColor('#08060f');}catch(e){}
      }
    }catch(e){tg=null;ready=false;}
  }
  function isReady(){return ready;}
  function user(){
    if(!ready||!tg.initDataUnsafe||!tg.initDataUnsafe.user)return null;
    const u=tg.initDataUnsafe.user;
    return {id:u.id,firstName:u.first_name||'Pemain',username:u.username||null};
  }
  function haptic(type){
    if(!ready)return;
    try{
      if(type==='err'&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('error');
      else if(type==='ok'&&tg.HapticFeedback)tg.HapticFeedback.notificationOccurred('success');
      else if(type==='light'&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred('light');
    }catch(e){}
  }
  function backButton(show,cb){
    if(!ready||!tg.BackButton)return;
    try{
      if(show){tg.BackButton.show();tg.BackButton.onClick(cb);}
      else{tg.BackButton.hide();tg.BackButton.offClick(cb);}
    }catch(e){}
  }
  return {init,isReady,user,haptic,backButton};
})();

const SAVE_VERSION=1;
function createNewState(className,playerName){
  return {
    version:SAVE_VERSION,
    player:{name:playerName||'Tanpa Nama',class:className,level:1,xp:0,
      hp:100,maxHp:100,stamina:50,maxStamina:50,atk:10,def:5,
      loreKnowledge:0,reputation:0,skillPoints:0,skills:[]},
    inventory:{keping:0,items:[],equip:{weapon:null,armor:null,artifact1:null,artifact2:null}},
    spirits:[],activeSpiritId:null,
    quests:{activeId:'malam_pertama',stepIndex:0,flags:{}},
    journal:{clues:[],booksRead:[],locationsFound:[],spiritsSeen:[],spiritsCaught:[]},
    world:{currentLocation:'desa',visited:['desa'],nightCount:1},
    meta:{createdAt:Date.now(),lastSave:0}
  };
}
function validateState(s){
  if(!s||typeof s!=='object')return false;
  if(!s.player||!s.inventory||!s.quests||!s.world)return false;
  if(s.activeSpiritId&&!s.spirits.find(x=>x.uid===s.activeSpiritId))s.activeSpiritId=null;
  for(const k of Object.keys(s.inventory.equip)){
    const v=s.inventory.equip[k];
    if(v&&!s.inventory.items.find(it=>it.uid===v))s.inventory.equip[k]=null;
  }
  s.player.hp=clamp(s.player.hp,0,s.player.maxHp);
  s.player.stamina=clamp(s.player.stamina,0,s.player.maxStamina);
  return true;
}
function migrate(s){if(!s.version)s.version=1;return s;}

/* ---------- SAVE ---------- */
const SAVE_KEY='bhuankamaya_save_v1';
function saveGame(state){

function loadGame(){

    if(!raw)return null;
    let s=JSON.parse(raw);s=migrate(s);
    if(!validateState(s))return null;return s;
  }catch(e){return null;}
}
function resetSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function exportSave(s){return JSON.stringify(s,null,2);}
function importSave(str){
  try{let s=JSON.parse(str);s=migrate(s);
    if(!validateState(s))return null;return s;}catch(e){return null;}
}

/* ---------- PLAYER ---------- */
function xpNeeded(L){return 100+75*(L-1)+25*(L-1)*(L-1);}
const MAX_LEVEL=20;
function recalcStats(state){
  const c=CLASSES[state.player.class];const L=state.player.level;
  const baseHp=100+20*(L-1),baseSta=50+5*(L-1),baseAtk=10+3*(L-1),baseDef=5+2*(L-1);
  let eqAtk=0,eqDef=0;
  const eq=state.inventory.equip;
  for(const k of ['weapon','armor','artifact1','artifact2']){
    const u=eq[k];if(!u)continue;
    const inst=state.inventory.items.find(x=>x.uid===u);if(!inst)continue;
    const item=ITEMS[inst.id];if(!item)continue;
    eqAtk+=item.atk||0;eqDef+=item.def||0;
  }
  const newMaxHp=Math.round(baseHp*c.hpMult)+eqDef*2;
  const newMaxSta=Math.round(baseSta*c.staMult);
  const newAtk=Math.round(baseAtk*c.atkMult)+eqAtk;
  const newDef=Math.round(baseDef*c.defMult)+eqDef;
  const hpRatio=state.player.maxHp>0?state.player.hp/state.player.maxHp:1;
  state.player.maxHp=newMaxHp;
  state.player.hp=Math.min(newMaxHp,Math.round(newMaxHp*hpRatio));
  state.player.maxStamina=newMaxSta;
  state.player.stamina=Math.min(state.player.stamina,newMaxSta);
  state.player.atk=newAtk;state.player.def=newDef;
}
function addXp(state,amount){
  state.player.xp+=amount;const events=[];
  while(state.player.level<MAX_LEVEL&&state.player.xp>=xpNeeded(state.player.level)){
    state.player.xp-=xpNeeded(state.player.level);
    state.player.level++;state.player.skillPoints++;
    recalcStats(state);events.push(state.player.level);
  }
  return events;
}

/* ---------- INVENTORY ---------- */
function addItem(state,itemId,qty){
  qty=qty||1;const def=ITEMS[itemId];if(!def)return false;
  if(def.kind==='item'||def.kind==='book'){
    const ex=state.inventory.items.find(x=>x.id===itemId);
    if(ex)ex.qty+=qty;else state.inventory.items.push({uid:uid(),id:itemId,qty:qty});
  }else{
    for(let i=0;i<qty;i++)state.inventory.items.push({uid:uid(),id:itemId,qty:1});
  }
  return true;
}
function removeItem(state,uidOrId,qty){
  qty=qty||1;
  const idx=state.inventory.items.findIndex(x=>x.uid===uidOrId||x.id===uidOrId);
  if(idx<0)return false;
  const inst=state.inventory.items[idx];inst.qty-=qty;
  if(inst.qty<=0){
    for(const k of Object.keys(state.inventory.equip)){
      if(state.inventory.equip[k]===inst.uid)state.inventory.equip[k]=null;
    }
    state.inventory.items.splice(idx,1);recalcStats(state);
  }
  return true;
}
function equipItem(state,u){
  const inst=state.inventory.items.find(x=>x.uid===u);if(!inst)return false;
  const def=ITEMS[inst.id];if(!def)return false;
  const slot=def.kind;
  if(slot==='weapon')state.inventory.equip.weapon=u;
  else if(slot==='armor')state.inventory.equip.armor=u;
  else if(slot==='artifact'){
    if(!state.inventory.equip.artifact1)state.inventory.equip.artifact1=u;
    else if(!state.inventory.equip.artifact2)state.inventory.equip.artifact2=u;
    else state.inventory.equip.artifact1=u;
  }else return false;
  recalcStats(state);return true;
}
function unequipSlot(state,slot){
  if(!(slot in state.inventory.equip))return false;
  state.inventory.equip[slot]=null;recalcStats(state);return true;
}
function useConsumable(state,u){
  const inst=state.inventory.items.find(x=>x.uid===u);if(!inst)return {ok:false,msg:'Item tidak ditemukan.'};
  const def=ITEMS[inst.id];if(!def||def.kind!=='item')return {ok:false,msg:'Bukan item pakai.'};
  const out={ok:true,msg:''};
  if(def.use.hp){const b=state.player.hp;state.player.hp=Math.min(state.player.maxHp,state.player.hp+def.use.hp);out.msg+='+'+(state.player.hp-b)+' HP. ';}
  if(def.use.sta){const b=state.player.stamina;state.player.stamina=Math.min(state.player.maxStamina,state.player.stamina+def.use.sta);out.msg+='+'+(state.player.stamina-b)+' Stamina.';}
  if(def.use.captureBuff){out.msg+='+'+Math.round(def.use.captureBuff*100)+'% Keep (encounter ini).';}
  removeItem(state,inst.uid,1);return out;
}
function readBook(state,u){
  const inst=state.inventory.items.find(x=>x.uid===u);if(!inst)return {ok:false,msg:'Buku tidak ditemukan.'};
  const def=ITEMS[inst.id];if(!def||def.kind!=='book')return {ok:false,msg:'Bukan buku.'};
  if(state.journal.booksRead.indexOf(def.id)>=0)return {ok:false,msg:'Sudah pernah dibaca.'};
  let bonus=def.lore||0;
  if(state.player.class==='AHLI_WARISAN')bonus=Math.round(bonus*1.5);
  else if(state.player.skills.indexOf('ancient_lore')>=0)bonus=Math.round(bonus*1.5);
  state.player.loreKnowledge+=bonus;
  state.journal.booksRead.push(def.id);
  return {ok:true,msg:'+'+bonus+' Lore Knowledge.'};
}

/* ---------- SPIRIT ---------- */
function spiritBaseStats(speciesId,level){
  const sp=SPIRITS[speciesId];if(!sp)return null;
  const L=level||1;
  return {maxHp:sp.baseHp+8*(L-1),atk:sp.baseAtk+2*(L-1),def:sp.baseDef+1*(L-1)};
}
function captureChance(state,hp,maxHp,rarity,lvl,type,extra){
  const hpFrac=1-(hp/maxHp);
  let c=0.10+0.60*hpFrac;
  c-=(RARITY_PENALTY[rarity]||0);
  c-=0.03*Math.max(0,lvl-state.player.level);c=Math.max(0,c);
  c+=state.player.class==='DUKUN'?0.15:0.05;
  if(type==='Demon'&&state.player.skills.indexOf('demonology_knowledge')>=0)c+=0.15;
  if(extra)c+=extra;
  for(const k of ['weapon','armor','artifact1','artifact2']){
    const u=state.inventory.equip[k];if(!u)continue;
    const inst=state.inventory.items.find(x=>x.uid===u);if(!inst)continue;
    const def=ITEMS[inst.id];if(def&&def.spiritBonus)c+=def.spiritBonus;
  }
  return clamp(c,0.05,0.95);
}
function addSpirit(state,speciesId,level){
  const sp=SPIRITS[speciesId];if(!sp)return null;
  const stats=spiritBaseStats(speciesId,level||1);
  const inst={uid:uid(),speciesId:speciesId,nickname:sp.name,level:level||1,xp:0,
    hp:stats.maxHp,maxHp:stats.maxHp,atk:stats.atk,def:stats.def};
  state.spirits.push(inst);
  if(state.journal.spiritsCaught.indexOf(speciesId)<0)state.journal.spiritsCaught.push(speciesId);
  return inst;
}
function setActiveSpirit(state,u){
  if(u&&!state.spirits.find(x=>x.uid===u))return false;
  state.activeSpiritId=u||null;return true;
}
function getActive(state){
  if(!state.activeSpiritId)return null;
  return state.spirits.find(x=>x.uid===state.activeSpiritId)||null;
}
function renameSpirit(state,u,name){
  const s=state.spirits.find(x=>x.uid===u);if(!s)return false;
  const clean=String(name).slice(0,20).trim();if(!clean)return false;
  s.nickname=clean;return true;
}
function addSpiritXp(state,amount){
  const s=getActive(state);if(!s)return;
  s.xp+=amount;
  while(s.level<20&&s.xp>=xpNeeded(s.level)){
    s.xp-=xpNeeded(s.level);s.level++;
    const st=spiritBaseStats(s.speciesId,s.level);
    const hpRatio=s.hp/s.maxHp;
    s.maxHp=st.maxHp;s.hp=Math.round(st.maxHp*hpRatio);
    s.atk=st.atk;s.def=st.def;
  }
}
function restAllSpirits(state){for(const s of state.spirits)s.hp=s.maxHp;}
function upgradeCost(s){return 30+s.level*20;}
function upgradeSpirit(state,u){
  const s=state.spirits.find(x=>x.uid===u);if(!s)return {ok:false,msg:'Spirit tidak ditemukan.'};
  const cost=upgradeCost(s);
  if(state.inventory.keping<cost)return {ok:false,msg:'Butuh '+cost+' Keping.'};
  if(s.level>=20)return {ok:false,msg:'Level maksimum.'};
  state.inventory.keping-=cost;s.level++;
  const st=spiritBaseStats(s.speciesId,s.level);
  s.maxHp=st.maxHp;s.hp=st.maxHp;s.atk=st.atk;s.def=st.def;
  return {ok:true,msg:s.nickname+' naik ke level '+s.level+'!'};
}

/* ---------- QUEST ---------- */
function currentQuest(state){return state.quests.activeId?QUESTS[state.quests.activeId]:null;}
function setFlag(state,flag){
  if(!flag)return false;
  if(state.quests.flags[flag])return false;
  state.quests.flags[flag]=true;return true;
}
function hasFlag(state,flag){return !!state.quests.flags[flag];}
function applyRewards(state,rw,notify){
  if(!rw)return;const parts=[];
  if(rw.xp){addXp(state,rw.xp);parts.push('+'+rw.xp+' XP');}
  if(rw.keping){state.inventory.keping+=rw.keping;parts.push('+'+rw.keping+' Keping');}
  if(rw.item){addItem(state,rw.item,1);parts.push('+'+rw.item);}
  if(rw.reputation){state.player.reputation+=rw.reputation;parts.push('+'+rw.reputation+' Reputasi');}
  if(notify&&parts.length)notify(parts.join(', '));
}
function tryAdvance(state,eventKey,notify){
  const q=currentQuest(state);if(!q)return false;
  const step=q.steps[state.quests.stepIndex];if(!step)return false;
  let advanced=false;
  if(step.auto&&step.flag&&!state.quests.flags[step.flag]){
    setFlag(state,step.flag);applyRewards(state,step.onEnterReward,notify);advanced=true;
  }
  if(!advanced&&step.requires&&step.requires.every(f=>state.quests.flags[f])&&step.flag&&!state.quests.flags[step.flag]){
    setFlag(state,step.flag);applyRewards(state,step.onEnterReward,notify);advanced=true;
  }
  if(!advanced&&step.trigger&&eventKey===step.trigger){
    setFlag(state,step.flag);applyRewards(state,step.onEnterReward,notify);advanced=true;
  }
  if(advanced){
    state.quests.stepIndex=Math.min(state.quests.stepIndex+1,q.steps.length);
    if(state.quests.stepIndex<q.steps.length)tryAdvance(state,null,notify);
    return true;
  }
  return false;
}
function questProgress(state){
  const q=currentQuest(state);
  if(!q)return {title:'Tidak ada quest aktif',total:0,cur:0,steps:[]};
  return {title:q.title,total:q.steps.length,cur:state.quests.stepIndex,
    steps:q.steps.map((s,i)=>({id:s.id,text:s.text,done:i<state.quests.stepIndex,current:i===state.quests.stepIndex}))};
}

/* ---------- EXPLORE ---------- */
function getLocation(state){return LOCATIONS[state.world.currentLocation];}
function canEnter(state,locId){
  const loc=LOCATIONS[locId];if(!loc)return {ok:false,reason:'Lokasi tidak dikenal.'};
  const cur=getLocation(state);if(!cur)return {ok:false,reason:'Lokasi sekarang rusak.'};
  const exit=(cur.exits||[]).find(e=>e.to===locId);
  if(!exit)return {ok:false,reason:'Tidak ada jalan ke sana.'};
  const g=exit.gate||{};
  if(g.flag&&!hasFlag(state,g.flag))return {ok:false,reason:'Jalan ini belum terbuka.'};
  if(g.level&&state.player.level<g.level)return {ok:false,reason:'Butuh Level '+g.level+'.'};
  if(g.reputation&&state.player.reputation<g.reputation)return {ok:false,reason:'Butuh Reputasi '+g.reputation+'.'};
  if(g.item){
    const has=state.inventory.items.find(x=>x.id===g.item);
    if(!has)return {ok:false,reason:'Butuh item: '+(ITEMS[g.item]?ITEMS[g.item].name:g.item)+'.'};
  }
  return {ok:true};
}
function enterLocation(state,locId,notify){
  const chk=canEnter(state,locId);if(!chk.ok)return {ok:false,msg:chk.reason};
  state.world.currentLocation=locId;
  if(state.world.visited.indexOf(locId)<0){
    state.world.visited.push(locId);
    if(state.journal.locationsFound.indexOf(locId)<0)state.journal.locationsFound.push(locId);
  }
  tryAdvance(state,'enter:'+locId,notify);
  if(locId==='rumah_kosong')setFlag(state,'masuk_rumah');
  if(locId==='ruang_bawah_tanah')setFlag(state,'bawah_tanah');
  if(locId==='altar')setFlag(state,'altar_ditemukan');
  return {ok:true};
}
function investigate(state,pointId,notify){
  const loc=getLocation(state);
  if(!loc||!loc.points)return {ok:false,msg:'Tidak ada yang bisa diperiksa.'};
  const p=loc.points.find(x=>x.id===pointId);
  if(!p)return {ok:false,msg:'Titik tidak ditemukan.'};
  if(hasFlag(state,p.flag))return {ok:false,msg:'Sudah diperiksa.'};
  setFlag(state,p.flag);
  if(p.gives)addItem(state,p.gives,1);
  if(state.journal.clues.indexOf(p.id)<0)state.journal.clues.push(p.id);
  tryAdvance(state,null,notify);
  return {ok:true,text:p.text,gives:p.gives};
}
function searchSpirit(state){
  const loc=getLocation(state);
  if(!loc||loc.actions.indexOf('cari_spirit')<0)return {ok:false,msg:'Tidak bisa mencari spirit di sini.'};
  const p=0.6+(state.player.skills.indexOf('spirit_detection')>=0?0.2:0);
  if(!chance(p))return {ok:true,found:false,msg:'Tidak ada spirit kali ini.'};
  const table={hutan:['pocong_kecil','kunti_kecil','genderuwo_muda'],
    makam_tua:['pocong_kecil','arwah_penunggu','kunti_kecil'],
    gua:['iblis_kecil','genderuwo_muda']};
  const ids=table[loc.id]||['pocong_kecil'];
  const sid=pick(ids);
  if(state.journal.spiritsSeen.indexOf(sid)<0)state.journal.spiritsSeen.push(sid);
  return {ok:true,found:true,speciesId:sid};
}
function restAtVillage(state){
  state.player.hp=state.player.maxHp;state.player.stamina=state.player.maxStamina;
  state.world.nightCount+=1;return {ok:true};
}

/* ---------- COMBAT ---------- */
function startCombat(state,enemyId,opts){
  opts=opts||{};
  const base=ENEMIES[enemyId];if(!base)return null;
  const enemy={id:base.id,name:base.name,type:base.type,level:base.level,
    hp:base.hp,maxHp:base.hp,atk:base.atk,def:base.def,
    pattern:base.pattern.slice(),patternIdx:0,xp:base.xp,keping:base.keping};
  return {enemy:enemy,isSpirit:!!opts.isSpirit,speciesId:opts.speciesId||null,
    rarity:opts.rarity||null,nonLethal:!!opts.isSpirit,
    log:[{t:'sys',m:'Kamu menghadapi '+enemy.name+' (Lv '+enemy.level+').'}],
    turn:'player',defending:false,dodgeNext:false,counterNext:false,
    buffs:{def:0,defTurns:0,dmgDealt:0,dmgTurns:0,atkTurns:0},
    captureBuff:0,over:false,result:null,
    reward:{xp:0,keping:0,items:[]}};
}
function startSpiritCombat(state,speciesId,isProlog){
  const spDef=SPIRITS[speciesId];if(!spDef)return null;
  let enemyId='bayangan_kecil';
  if(speciesId==='arwah_penunggu')enemyId='arwah_penunggu';
  else if(speciesId==='kunti_kecil')enemyId='hantu_hutan';
  else if(speciesId==='genderuwo_muda')enemyId='hantu_hutan';
  else if(speciesId==='iblis_kecil')enemyId='iblis_kecil';
  else if(speciesId==='pocong_kecil')enemyId='bayangan_kecil';
  const enemyBase=ENEMIES[enemyId];
  const enemy={id:speciesId,name:spDef.name,type:spDef.type,level:1,
    hp:spDef.baseHp,maxHp:spDef.baseHp,atk:spDef.baseAtk,def:spDef.baseDef,
    pattern:enemyBase.pattern.slice(),patternIdx:0,xp:enemyBase.xp,keping:enemyBase.keping};
  const c={enemy:enemy,isSpirit:true,speciesId:speciesId,rarity:spDef.rarity,
    nonLethal:true,
    log:[{t:'sys',m:'Kau berhadapan dengan '+spDef.name+' ('+spDef.rarity+').'},
         {t:'sys',m:'Non-lethal aktif. Gunakan Keep Spirit saat HP ≤ 50%.'}],
    turn:'player',defending:false,dodgeNext:false,counterNext:false,
    buffs:{def:0,defTurns:0,dmgDealt:0,dmgTurns:0,atkTurns:0},
    captureBuff:0,over:false,result:null,
    reward:{xp:enemyBase.xp,keping:enemyBase.keping,items:[]}};
  if(state.journal.spiritsSeen.indexOf(speciesId)<0)state.journal.spiritsSeen.push(speciesId);
  if(isProlog)setFlag(state,'arwah_dihadapi');
  return c;
}
function cLog(c,t,m){c.log.push({t:t,m:m});if(c.log.length>60)c.log.shift();}
function dmgCalc(atk,def,power,variance){
  const base=atk*(power||1);
  const reduction=100/(100+def);
  const v=variance?rng(0.9,1.1):1;
  return Math.max(1,Math.round(base*reduction*v));
}
function applyDamageToEnemy(c,dmg){
  if(c.guarding){ dmg = Math.round(dmg * 0.5); c.guarding = false; }
  if(c.nonLethal&&c.enemy.hp-dmg<1){
    dmg=Math.max(0,c.enemy.hp-1);
    cLog(c,'sys','Kamu menahan serangan agar tidak menghancurkan spirit.');
  }
  c.enemy.hp=Math.max(0,c.enemy.hp-dmg);
}
function canCapture(c){return c.isSpirit&&!c.over&&c.enemy.hp<=c.enemy.maxHp*0.5;}
function playerAttack(state,c){
  if(c.over)return;
  let dmg=dmgCalc(state.player.atk,c.enemy.def,1.0,true);
  if(c.buffs.dmgDealt)dmg=Math.round(dmg*(1+c.buffs.dmgDealt));
  const critChance=0.05+(state.player.class==='PENDEKAR'?0.08:0);
  if(chance(critChance)){dmg=Math.round(dmg*1.5);cLog(c,'me','Serangan kritis! '+dmg+' damage.');}
  else cLog(c,'me','Kamu menyerang. '+dmg+' damage.');
  applyDamageToEnemy(c,dmg);
  afterPlayerAction(state,c);
}
function playerSkill(state,c,skillId){
  if(c.over)return {ok:false,msg:'Combat sudah selesai.'};
  const sk=SKILLS[skillId];if(!sk)return {ok:false,msg:'Skill tidak dikenal.'};
  if(state.player.skills.indexOf(skillId)<0)return {ok:false,msg:'Skill belum dipelajari.'};
  if(sk.type==='passive')return {ok:false,msg:'Skill pasif.'};
  if(sk.type==='buff'||sk.type==='stance'){
    if(state.player.stamina<sk.cost)return {ok:false,msg:'Stamina kurang.'};
    state.player.stamina-=sk.cost;
    if(sk.type==='buff'){
      const e=sk.effect||{};
      if(e.def){c.buffs.def=parseFloat(e.def)/100;c.buffs.defTurns=e.turns;}
      if(e.dmgDealt){c.buffs.dmgDealt=parseFloat(e.dmgDealt)/100;c.buffs.dmgTurns=e.turns;}
      if(e.capture){c.captureBuff=(c.captureBuff||0)+parseFloat(e.capture)/100;}
      cLog(c,'me','Kamu menggunakan '+sk.name+'.');
    }else{c.counterNext=true;cLog(c,'me','Kamu bersiap membalas.');}
    afterPlayerAction(state,c);
    return {ok:true};
  }
  if(sk.type==='attack'){
    if(state.player.stamina<sk.cost)return {ok:false,msg:'Stamina kurang.'};
    state.player.stamina-=sk.cost;
    let def=c.enemy.def;
    if(sk.element==='astral')def=Math.round(def*0.7);
    let dmg=dmgCalc(state.player.atk,def,sk.power,true);
    if(sk.id==='tebasan'&&chance(0.20))dmg=Math.round(dmg*1.5);
    if(c.buffs.dmgDealt)dmg=Math.round(dmg*(1+c.buffs.dmgDealt));
    applyDamageToEnemy(c,dmg);
    cLog(c,'me',sk.name+' → '+dmg+' damage.');
    afterPlayerAction(state,c);
    return {ok:true};
  }
  return {ok:false,msg:'Skill tidak bisa dipakai.'};
}
function playerDefend(state,c){
  if(c.over)return;
  c.defending=true;
  state.player.stamina=clamp(state.player.stamina+8,0,state.player.maxStamina);
  cLog(c,'me','Kamu bertahan. +8 Stamina.');
  afterPlayerAction(state,c);
}
function playerDodge(state,c){
  if(c.over)return {ok:false};
  if(state.player.stamina<10)return {ok:false,msg:'Stamina kurang.'};
  state.player.stamina-=10;c.dodgeNext=true;
  cLog(c,'me','Kamu bersiap menghindar.');
  afterPlayerAction(state,c);
  return {ok:true};
}
function playerCapture(state,c,extra){
  if(c.over)return {ok:false,msg:'Combat selesai.'};
  if(!canCapture(c))return {ok:false,msg:'HP spirit masih di atas 50%.'};
  if(state.player.stamina<15)return {ok:false,msg:'Butuh 15 Stamina.'};
  state.player.stamina-=15;
  const cv=captureChance(state,c.enemy.hp,c.enemy.maxHp,c.rarity,c.enemy.level,c.enemy.type,(c.captureBuff||0)+(extra||0));
  cLog(c,'me','Kamu mencoba mengikat '+c.enemy.name+'...');
  if(chance(cv)){
    cLog(c,'sys','Berhasil! '+c.enemy.name+' menjadi milikmu.');
    return {ok:true,captured:true,chance:cv};
  }
  cLog(c,'sys','Gagal. ('+Math.round(cv*100)+'%)');
  afterPlayerAction(state,c);
  return {ok:true,captured:false,chance:cv};
}
function playerFlee(state,c){
  if(c.over)return {ok:false};
  if(state.player.stamina<5)return {ok:false,msg:'Stamina kurang.'};
  state.player.stamina-=5;
  const p=0.5+0.03*(state.player.level-c.enemy.level);
  if(chance(clamp(p,0.2,0.9))){
    cLog(c,'sys','Kamu berhasil melarikan diri.');
    c.over=true;c.result='fled';
    return {ok:true,fled:true};
  }
  cLog(c,'sys','Kamu gagal melarikan diri.');
  afterPlayerAction(state,c);
  return {ok:true,fled:false};
}
function toggleNonLethal(c){if(!c.isSpirit)return;c.nonLethal=!c.nonLethal;}
function afterPlayerAction(state,c){
  if(c.over)return;
  if(c.enemy.hp<=0){endCombat(state,c,'win');return;}
  const sp=getActive(state);
  if(sp&&sp.hp>0){
    let dmg=dmgCalc(sp.atk,c.enemy.def,1.0,true);
    if(c.nonLethal&&c.enemy.hp-dmg<1)dmg=Math.max(0,c.enemy.hp-1);
    c.enemy.hp=Math.max(0,c.enemy.hp-dmg);
    cLog(c,'sp',sp.nickname+' menyerang → '+dmg+' damage.');
    if(c.enemy.hp<=0){endCombat(state,c,'win');return;}
  }
  enemyTurn(state,c);
}
function enemyTurn(state,c){
  if(c.over)return;
  const action=c.enemy.pattern[c.enemy.patternIdx%c.enemy.pattern.length];
  c.enemy.patternIdx++;
  if(action==='guard'){
    cLog(c,'foe',c.enemy.name+' menahan serangan.');
    c.guarding = true;
    c.turn='player';return;
  }
  const power=action==='heavy'?1.5:1.0;
  if(c.dodgeNext){
    c.dodgeNext=false;
    if(chance(0.6)){
      cLog(c,'foe',c.enemy.name+' menyerang — kamu menghindar!');
      c.turn='player';c.defending=false;tickBuffs(c);return;
    }
    cLog(c,'foe','Kamu gagal menghindar!');
  }
  let dmg=dmgCalc(c.enemy.atk,state.player.def,power,true);
  if(c.defending)dmg=Math.round(dmg*0.5);
  if(c.buffs.defTurns>0)dmg=Math.round(dmg*(1-c.buffs.def));
  if(c.enemy.type==='Spirit'&&state.player.skills.indexOf('spirit_resistance')>=0)dmg=Math.round(dmg*0.8);
  dmg=Math.max(1,dmg);
  state.player.hp=Math.max(0,state.player.hp-dmg);
  cLog(c,'foe',c.enemy.name+' menyerang → '+dmg+' damage.');
  if(c.counterNext){
    c.counterNext=false;
    let cd=dmgCalc(state.player.atk,c.enemy.def,0.8,false);
    if(c.nonLethal&&c.enemy.hp-cd<1)cd=Math.max(0,c.enemy.hp-1);
    c.enemy.hp=Math.max(0,c.enemy.hp-cd);
    cLog(c,'me','Balasan → '+cd+' damage.');
    if(c.enemy.hp<=0){endCombat(state,c,'win');return;}
  }
  c.defending=false;tickBuffs(c);
  if(state.player.hp<=0){endCombat(state,c,'lose');return;}
  c.turn='player';
}
function tickBuffs(c){
  if(c.buffs.defTurns>0){c.buffs.defTurns--;if(c.buffs.defTurns===0)c.buffs.def=0;}
  if(c.buffs.dmgTurns>0){c.buffs.dmgTurns--;if(c.buffs.dmgTurns===0)c.buffs.dmgDealt=0;}
}
function endCombat(state,c,result){
  c.over=true;c.result=result;
  if(result==='win'){
    c.reward.xp=c.enemy.xp;c.reward.keping=c.enemy.keping;
    cLog(c,'sys','Kemenangan! +'+c.reward.xp+' XP, +'+c.reward.keping+' Keping.');
    addXp(state,c.reward.xp);
    state.inventory.keping+=c.reward.keping;
    addSpiritXp(state,Math.round(c.reward.xp*0.6));
  }else if(result==='lose'){cLog(c,'sys','Kamu tumbang...');}
  else if(result==='fled'){cLog(c,'sys','Kamu melarikan diri.');}
}

 if(loc.exits && loc.exits.length){

/* ---------- SCREEN: INVENTORY ---------- */
function screenInventory(){
  const inv = state.inventory;
  const groups = {weapon:[],armor:[],artifact:[],book:[],item:[],quest:[],spirit:[]};
  for(const inst of inv.items){
    const d = ITEMS[inst.id];
    if(!d) continue;
    (groups[d.kind]||groups.item).push({inst:inst, def:d});
  }
  const isEq = function(u){
    return Object.keys(inv.equip).some(k=>inv.equip[k]===u);
  };
  function groupHtml(title, arr){
    if(!arr.length) return '';
    let h = '<div class="panel tight">';
    h += '<div class="row between"><h2>'+title+'</h2><span class="muted">'+arr.length+'</span></div>';
    for(const o of arr){
      const eq = isEq(o.inst.uid);
      h += '<div class="item-row" data-act="item-detail" data-uid="'+o.inst.uid+'">';
      h += '<div class="item-ico">'+(o.def.ico||'◈')+'</div>';
      h += '<div class="item-body"><div class="item-name">'+esc(o.def.name);
      if(o.inst.qty>1) h += ' <span class="muted">×'+o.inst.qty+'</span>';
      h += '</div><div class="item-sub">'+esc(o.def.desc||'');
      if(eq) h += ' · <span style="color:var(--accent)">Terpakai</span>';
      h += '</div></div></div>';
    }
    h += '</div>';
    return h;
  }
  let html = '<div class="panel"><div class="row between"><h1>Inventori</h1>';
  html += '<div class="stat-chip">🪙 <b>'+inv.keping+'</b></div></div></div>';
  html += groupHtml('Senjata', groups.weapon);
  html += groupHtml('Armor', groups.armor);
  html += groupHtml('Artefak', groups.artifact);
  html += groupHtml('Buku', groups.book);
  html += groupHtml('Item Pakai', groups.item);
  html += groupHtml('Item Quest', groups.quest);
  if(!inv.items.length) html += '<div class="empty">Inventori kosong.</div>';
  return html;
}

/* ---------- MODAL SYSTEM ---------- */
const modalStack = [];
function openModal(opts){
  const root = el('modal-root');
  root.classList.add('show');
  const modal = document.createElement('div');
  modal.className = 'modal';
  let html = '';
  if(opts.title) html += '<div class="modal-title">'+esc(opts.title)+'</div>';
  html += '<div class="modal-body">'+(opts.body||'')+'</div>';
  html += '<div class="modal-actions"></div>';
  modal.innerHTML = html;
  const actionsEl = modal.querySelector('.modal-actions');
  (opts.actions||[]).forEach(function(a){
    const b = document.createElement('button');
    b.className = 'btn ' + (a.cls||'');
    b.textContent = a.label;
    b.addEventListener('click', function(){
      TG.haptic('light');
      if(a.keep !== true) closeModal();
      if(a.onClick) a.onClick();
    });
    actionsEl.appendChild(b);
  });
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.addEventListener('click', function(){
    if(!modal.dataset.locked) closeModal();
  });
  root.appendChild(bg);
  root.appendChild(modal);
  modalStack.push({el:modal, bg:bg});
}
function closeModal(){
  const root = el('modal-root');
  const top = modalStack.pop();
  if(top){ top.el.remove(); top.bg.remove(); }
  if(!modalStack.length) root.classList.remove('show');
}
function closeAllModals(){
  while(modalStack.length) closeModal();
  el('modal-root').classList.remove('show');
}
function toast(msg, type){
  const root = el('toast-root');
  const t = document.createElement('div');
  t.className = 'toast' + (type?' '+type:'');
  t.textContent = msg;
  root.appendChild(t);
  setTimeout(function(){ t.style.opacity='0'; t.style.transition='opacity .3s'; }, 1800);
  setTimeout(function(){ t.remove(); }, 2200);
}
function confirmDialog(title, msg, onYes, yesLabel, noLabel){
  openModal({
    title: title,
    body: '<p>'+esc(msg)+'</p>',
    actions: [
      {label: noLabel||'Batal', cls:''},
      {label: yesLabel||'Ya', cls:'primary', onClick: onYes}
    ]
  });
}

/* ---------- SCREEN ROUTER ---------- */
function setActiveTab(name){
  const tabs = document.querySelectorAll('#bottom-nav button');
  for(const b of tabs){
    b.classList.toggle('active', b.dataset.tab === name);
  }
}
function showScreen(name){
  ui.screen = name;
  closeAllModals();
  renderScreen();
  setActiveTab(name);
  TG.backButton(name !== 'home', handleBack);
}
function handleBack(){
  if(ui.combat && !ui.combat.over) return;
  if(ui.screen !== 'home') showScreen('home');
}
function renderScreen(){
  renderHeader();
  const elScreen = el('screen');
  let html = '';
  switch(ui.screen){
    case 'home': html = screenHome(); break;
    case 'explore': html = screenExplore(); break;
    case 'quest': html = screenQuest(); break;
    case 'inventory': html = screenInventory(); break;
    case 'spirit': html = screenSpirit(); break;
    case 'journal': html = screenJournal(); break;
    case 'character': html = screenCharacter(); break;
    case 'combat': html = screenCombat(); break;
  }
  elScreen.innerHTML = html;
  if(ui.screen === 'combat'){
    const logEl = el('combat-log');
    if(logEl) logEl.scrollTop = logEl.scrollHeight;
  }
}

function startNewGame(classId, name){
  state = createNewState(classId, name);
  const c = CLASSES[classId];
  for(const sk of c.startSkills){
    if(state.player.skills.indexOf(sk) < 0) state.player.skills.push(sk);
  }
  for(const it of c.startItems){ addItem(state, it, 1); }
  for(const inst of state.inventory.items){
    const d = ITEMS[inst.id];
    if(d && (d.kind==='weapon' || d.kind==='armor')) equipItem(state, inst.uid);
  }
  recalcStats(state);
  state.player.hp = state.player.maxHp;
  state.player.stamina = state.player.maxStamina;
  tryAdvance(state, null, function(m){ toast(m,'ok'); });
  saveGame(state);
  closeAllModals();
  showScreen('home');
  toast('Selamat datang, '+name+'.', 'ok');
}

/* ---------- ACTION HANDLER ---------- */
function handleAction(act, data){
  TG.haptic('light');
  switch(act){
    case 'go-explore': showScreen('explore'); break;

    /* ----- EXPLORE ----- */
    case 'goto': {
      const r = enterLocation(state, data.id, function(m){ toast(m,'ok'); });
      if(!r.ok){ toast(r.msg, 'err'); return; }
      autosave();
      showScreen('explore');
      break;
    }
    case 'investigate': {
      const r = investigate(state, data.id, function(m){ toast(m,'ok'); });
      if(!r.ok){ toast(r.msg, 'err'); return; }
      autosave();
      if(hasFlag(state,'petunjuk_lengkap')){
        const rm = LOCATIONS.rumah_kosong;
        if(!rm.exits.find(function(e){ return e.to==='ruang_bawah_tanah'; })){
          rm.exits.push({ to:'ruang_bawah_tanah', label:'Turun ke Bawah Tanah' });
        }
      }
      showScreen('explore');
      openModal({
        title: 'Petunjuk',
        body: '<p>'+esc(r.text||'')+'</p>',
        actions: [{label:'OK', cls:'primary'}]
      });
      break;
    }
    case 'rest': {
      restAtVillage(state);
      restAllSpirits(state);
      autosave();
      toast('Istirahat. HP, Stamina, dan spirit pulih.', 'ok');
      showScreen('explore');
      break;
    }
    case 'elder': {
      if(!hasFlag(state, 'quest_diterima')){
        openModal({
          title:'Sesepuh Desa',
          body:'<p>"Ada rumah kosong di tepi desa. Lilin menyala sendiri di sana. Tolong periksa."</p><p class="muted">Kau menerima tugas.</p>',
          actions:[{label:'Terima', cls:'primary', onClick:function(){
            setFlag(state, 'quest_diterima');
            tryAdvance(state, 'bicara_sesepuh', function(m){ toast(m,'ok'); });
            autosave();
            showScreen('explore');
          }}]
        });
      } else if(hasFlag(state, 'altar_ditemukan') && !hasFlag(state, 'lapor_sesepuh')){
        setFlag(state, 'lapor_sesepuh');
        tryAdvance(state, 'lapor_sesepuh', function(m){ toast(m,'ok'); });
        autosave();
        openModal({
          title:'Laporan',
          body:'<p>"Arwah penunggu altar telah kutemui."</p><p class="muted">"Kau berhasil. Simpan amulet ini."</p>',
          actions:[{label:'Terima Amulet', cls:'primary'}]
        });
      } else {
        toast('"Hati-hati di luar sana."');
      }
      break;
    }
    case 'report': {
      setFlag(state, 'lapor_sesepuh');
      tryAdvance(state, 'lapor_sesepuh', function(m){ toast(m,'ok'); });
      autosave();
      openModal({
        title:'Laporan kepada Sesepuh',
        body:'<p>Kau melaporkan apa yang kau temui.</p><p class="muted">"Kau membawa arwah itu bersamamu... kuat. Tapi hati-hati."</p>',
        actions:[{label:'Selesai', cls:'primary'}]
      });
      showScreen('explore');
      break;
    }
    case 'search-spirit': {
      const r = searchSpirit(state);
      if(!r.ok){ toast(r.msg, 'err'); return; }
      if(!r.found){ toast(r.msg); return; }
      ui.combat = startSpiritCombat(state, r.speciesId, false);
      if(!ui.combat){ toast('Gagal memulai combat.', 'err'); return; }
      showScreen('combat');
      break;
    }
    case 'face-spirit': {
      if(hasFlag(state, 'spirit_pertama')){
        toast('Arwah di altar sudah kau ikat.');
        return;
      }
      ui.combat = startSpiritCombat(state, 'arwah_penunggu', true);
      if(!ui.combat){ toast('Gagal memulai combat.', 'err'); return; }
      autosave();
      showScreen('combat');
      break;
    }

   /* ----- INVENTORY ----- */
    case 'item-detail': {
      const u = data.uid;
      const inst = state.inventory.items.find(function(x){ return x.uid === u; });
      if(!inst) return;
      const d = ITEMS[inst.id];
      if(!d) return;
      const isEq = Object.keys(state.inventory.equip).some(function(k){ return state.inventory.equip[k]===u; });
      const actions = [];
      if(d.kind === 'weapon' || d.kind === 'armor' || d.kind === 'artifact'){
        if(isEq){
          actions.push({ label:'Lepas', onClick:function(){
            for(const k of Object.keys(state.inventory.equip)){
              if(state.inventory.equip[k]===u){ unequipSlot(state,k); break; }
            }
            autosave(); renderScreen();
          }});
        } else {
          actions.push({ label:'Pakai', cls:'primary', onClick:function(){
            equipItem(state, u);
            autosave(); renderScreen();
            toast('Dipakai.', 'ok');
          }});
        }
      }
      if(d.kind === 'item' && d.use){
        actions.push({ label:'Gunakan', cls:'ok', onClick:function(){
          const r = useConsumable(state, u);
          autosave(); renderScreen();
          toast(r.msg, r.ok ? 'ok' : 'err');
        }});
      }
      if(d.kind === 'book'){
        actions.push({ label:'Baca', cls:'gold', onClick:function(){
          const r = readBook(state, u);
          autosave(); renderScreen();
          toast(r.msg, r.ok ? 'ok' : 'err');
        }});
      }
      actions.push({ label:'Tutup' });
      let body = '<p class="muted">'+esc(d.desc||'')+'</p><div class="stat-row">';
      if(d.atk) body += '<span class="stat-chip">ATK <b>+'+d.atk+'</b></span>';
      if(d.def) body += '<span class="stat-chip">DEF <b>+'+d.def+'</b></span>';
      if(d.lore) body += '<span class="stat-chip">Lore <b>+'+d.lore+'</b></span>';
      if(d.spiritBonus) body += '<span class="stat-chip">Keep <b>+'+Math.round(d.spiritBonus*100)+'%</b></span>';
      body += '</div>';
      openModal({ title: d.name, body: body, actions: actions });
      break;
    }

    /* ----- SPIRIT ----- */
    case 'spirit-set-active': {
      const u = data.uid;
      if(state.activeSpiritId === u){ setActiveSpirit(state, null); toast('Spirit dilepas.'); }
      else { setActiveSpirit(state, u); toast('Spirit aktif.', 'ok'); }
      autosave(); renderScreen();
      break;
    }
    case 'spirit-rename': {
      const u = data.uid;
      const s = state.spirits.find(function(x){ return x.uid === u; });
      if(!s) return;
      openModal({
        title:'Ganti Nama Spirit',
        body:'<input id="rn-name" maxlength="20" value="'+esc(s.nickname)+'">',
        actions:[
          {label:'Batal'},
          {label:'Simpan', cls:'primary', keep:true, onClick:function(){
            const v = el('rn-name').value;
            if(renameSpirit(state, u, v)){
              autosave(); closeModal(); renderScreen();
              toast('Nama diganti.', 'ok');
            } else toast('Nama tidak valid.', 'err');
          }}
        ]
      });
      break;
    }
    case 'spirit-upgrade': {
      const u = data.uid;
      const r = upgradeSpirit(state, u);
      autosave(); renderScreen();
      toast(r.msg, r.ok ? 'ok' : 'err');
      break;
    }

    /* ----- CHARACTER ----- */
    case 'spend-skill-point': {
      showSkillLearnModal();
      break;
    }

    /* ----- SAVE ----- */
    case 'save-game': {
      if(saveGame(state)) toast('Progress disimpan.', 'ok');
      else toast('Gagal menyimpan.', 'err');
      break;
    }
    case 'export-save': {
      const json = exportSave(state);
      openModal({
        title:'Ekspor Save',
        body:'<p class="muted">Salin teks di bawah, simpan di tempat aman.</p><textarea id="ex-json" rows="8" readonly>'+esc(json)+'</textarea>',
        actions:[
          {label:'Salin', cls:'primary', keep:true, onClick:function(){
            const ta = el('ex-json');
            ta.select();
            try{ document.execCommand('copy'); toast('Tersalin ke clipboard.', 'ok'); }
            catch(e){ toast('Gagal menyalin. Salin manual.', 'err'); }
          }},
          {label:'Tutup'}
        ]
      });
      break;
    }
    case 'import-save': {
      openModal({
        title:'Impor Save',
        body:'<p class="muted">Tempel JSON save lama.</p><textarea id="im-json" rows="8" placeholder=\'{"version":1,...}\'></textarea>',
        actions:[
          {label:'Batal'},
          {label:'Impor', cls:'primary', keep:true, onClick:function(){
            const v = el('im-json').value;
            const s = importSave(v);
            if(s){
              state = s;
              recalcStats(state);
              saveGame(state);
              closeAllModals();
              showScreen('home');
              toast('Save berhasil diimpor.', 'ok');
            } else toast('JSON tidak valid.', 'err');
          }}
        ]
      });
      break;
    }
    case 'reset-game': {
      confirmDialog('Reset Progress', 'Semua progress akan dihapus. Tidak bisa dibatalkan.', function(){
        resetSave();
        state = null;
        closeAllModals();
        showNewGameModal();
      }, 'Reset', 'Batal');
      break;
    }

    /* ----- COMBAT ----- */
    case 'c-attack': {
      if(!ui.combat || ui.combat.over) return;
      playerAttack(state, ui.combat);
      autosave(); renderScreen(); checkCombatEnd();
      break;
    }
    case 'c-skill-menu': {
      showSkillMenu();
      break;
    }
    case 'c-defend': {
      playerDefend(state, ui.combat);
      autosave(); renderScreen(); checkCombatEnd();
      break;
    }
    case 'c-dodge': {
      const r = playerDodge(state, ui.combat);
      if(r && r.ok === false){ toast(r.msg, 'err'); return; }
      autosave(); renderScreen(); checkCombatEnd();
      break;
    }
    case 'c-capture': {
      const c = ui.combat;
      const r = playerCapture(state, c, 0);
      if(r && r.ok === false){ toast(r.msg, 'err'); return; }
      if(r.captured){
        const inst = addSpirit(state, c.speciesId, c.enemy.level);
        if(inst && !state.activeSpiritId) setActiveSpirit(state, inst.uid);
        // Reward combat
        addXp(state, c.reward.xp || c.enemy.xp);
        state.inventory.keping += (c.reward.keping || c.enemy.keping);
        addSpiritXp(state, Math.round((c.reward.xp || c.enemy.xp) * 0.6));
        c.over = true; c.result = 'win';
        cLog(c, 'sys', 'Kemenangan! +'+(c.reward.xp||c.enemy.xp)+' XP, +'+(c.reward.keping||c.enemy.keping)+' Keping.');
        // Trigger quest
        tryAdvance(state, 'combat_win:'+c.enemy.id, function(m){ toast(m,'ok'); });
        tryAdvance(state, 'spirit_caught:'+c.speciesId, function(m){ toast(m,'ok'); });
        autosave(); renderScreen();
        toast((inst?inst.nickname:c.enemy.name)+' menjadi companion-mu!', 'ok');
        return;
      }
      autosave(); renderScreen(); checkCombatEnd();
      break;
    }
    case 'c-flee': {
      const r = playerFlee(state, ui.combat);
      if(r && r.ok === false){ toast(r.msg, 'err'); return; }
      autosave(); renderScreen(); checkCombatEnd();
      break;
    }
    case 'c-toggle-lethal': {
      toggleNonLethal(ui.combat);
      renderScreen();
      break;
    }
    case 'c-close': {
      ui.combat = null;
      autosave();
      showScreen('home');
      break;
    }
  }
}

/* ---------- COMBAT END CHECK ---------- */
function checkCombatEnd(){
  const c = ui.combat;
  if(!c || !c.over) return;
  if(c.result === 'win'){
    // Trigger quest combat_win (menggunakan enemy.id)
    tryAdvance(state, 'combat_win:'+c.enemy.id, function(m){ toast(m,'ok'); });
    // Jika spirit dan belum di-capture, spirit buyar (bisa muncul lagi nanti)
  } else if(c.result === 'lose'){
    state.player.hp = Math.max(1, Math.round(state.player.maxHp * 0.3));
    state.world.currentLocation = 'desa';
    const loss = Math.floor(state.player.xp * 0.1);
    state.player.xp = Math.max(0, state.player.xp - loss);
  }
  autosave();
}

/* ---------- AUTOSAVE ---------- */
function autosave(){ if(state) saveGame(state); }

/* ---------- BOOTSTRAP ---------- */
function attachHandlers(){
  const tabs = document.querySelectorAll('#bottom-nav button');
  for(const b of tabs){
    b.onclick = function(){
      if(ui.combat && !ui.combat.over){ toast('Selesaikan combat dulu.'); return; }
      TG.haptic('light');
      showScreen(b.dataset.tab);
    };
  }
  el('btn-journal').onclick = function(){
    if(ui.combat && !ui.combat.over) return;
    TG.haptic('light');
    showScreen('journal');
  };
  el('btn-char').onclick = function(){
    if(ui.combat && !ui.combat.over) return;
    TG.haptic('light');
    showScreen('character');
  };
  el('screen').onclick = function(e){
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    handleAction(btn.dataset.act, btn.dataset);
  };
}

function boot(){
  TG.init();
  const existing = loadGame();
  if(existing){
    state = existing;
    recalcStats(state);
    showScreen('home');
    attachHandlers();
    toast('Progress dimuat.', 'ok');
  } else {
    attachHandlers();
    showNewGameModal();
  }
}

window.addEventListener('error', function(e){
  var el = document.getElementById('screen');
  if(el) el.innerHTML = '<div style="padding:20px;color:#f88;font-size:12px;font-family:monospace;white-space:pre-wrap;">ERROR:\n'+(e.message||'')+'\n'+(e.filename||'')+':'+(e.lineno||'')+'</div>';
});
if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  setTimeout(boot, 0);
}
window.addEventListener('beforeunload', function(){ if(state) saveGame(state); });

})();
